workflows:
  rider-android:
    name: ESH Rider Android
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      android_signing:
        - esh_android_upload
    scripts:
      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile
      - name: Sync Capacitor Rider project
        script: pnpm --filter @esh-platform/rider mobile:sync
      - name: Build signed Rider APK and app bundle
        script: |
          cd apps/rider/android
          bash ./gradlew assembleRelease bundleRelease
    artifacts:
      - apps/rider/android/app/build/outputs/apk/release/*.apk
      - apps/rider/android/app/build/outputs/bundle/release/*.aab

  driver-android:
    name: ESH Driver Android
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      android_signing:
        - esh_android_upload
    scripts:
      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile
      - name: Sync Capacitor Driver project
        script: pnpm --filter @esh-platform/driver mobile:sync
      - name: Build signed Driver APK and app bundle
        script: |
          cd apps/driver/android
          bash ./gradlew assembleRelease bundleRelease
    artifacts:
      - apps/driver/android/app/build/outputs/apk/release/*.apk
      - apps/driver/android/app/build/outputs/bundle/release/*.aab

  rider-ios:
    name: ESH Rider iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: esh-app-store-connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.esh.rider
    scripts:
      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile
      - name: Sync Capacitor Rider project
        script: pnpm --filter @esh-platform/rider mobile:sync
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Set unique Rider build number
        script: |
          cd apps/rider/ios/App
          agvtool new-version -all "$(date +%s)"
      - name: Build Rider IPA
        script: |
          cd apps/rider/ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "App"
    artifacts:
      - apps/rider/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  driver-ios:
    name: ESH Driver iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: esh-app-store-connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.esh.driver
    scripts:
      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile
      - name: Sync Capacitor Driver project
        script: pnpm --filter @esh-platform/driver mobile:sync
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Set unique Driver build number
        script: |
          cd apps/driver/ios/App
          agvtool new-version -all "$(date +%s)"
      - name: Build Driver IPA
        script: |
          cd apps/driver/ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "App"
    artifacts:
      - apps/driver/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
